<div class="overlay settings-overlay" role="presentation" (click)="game.closeSettings()">
  <section
    class="settings-modal"
    role="dialog"
    aria-modal="true"
    aria-label="遊戲設定"
    (click)="$event.stopPropagation()"
  >
    <header>
      <div>
        <p class="panel-kicker">SYSTEM MENU</p>
        <h2>冒險設定</h2>
      </div>
      <button type="button" (click)="game.closeSettings()" aria-label="關閉設定">×</button>
    </header>
    <div class="setting-row selection-limit-row">
      <div>
        <strong>每題最多選擇幾項</strong>
        <p>預設為 1，保留原本的單一路線；調高後可組合多個想探索的方向，並取得各方向需要的技能。</p>
      </div>
      <div class="selection-limit-control" role="group" aria-label="每題選擇數量上限">
        @for (limit of selectionLimits; track limit) {
          <button
            type="button"
            [class.is-active]="game.maxQuestSelections() === limit"
            [attr.aria-pressed]="game.maxQuestSelections() === limit"
            (click)="game.setMaxQuestSelections(limit)"
          >
            {{ limit }}
          </button>
        }
      </div>
    </div>
    <div class="setting-row">
      <div>
        <strong>預覽技能獎勵</strong>
        <p>開啟後，回答前會顯示每個選項可能獲得的技能。預設關閉，讓選擇更像角色扮演。</p>
      </div>
      <button
        class="toggle"
        type="button"
        role="switch"
        [attr.aria-checked]="game.previewRewards()"
        [class.is-on]="game.previewRewards()"
        (click)="game.toggleRewardPreview()"
      >
        <span></span>{{ game.previewRewards() ? '開啟' : '關閉' }}
      </button>
    </div>
    <div class="reset-zone">
      <div>
        <strong>重生整趟冒險</strong>
        <p>清除技能、選擇與探索進度，回到尚未取得任何技能的星引學徒。</p>
      </div>
      <button type="button" (click)="game.resetAdventure()">重生回原點</button>
    </div>
  </section>
</div>
