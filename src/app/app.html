<main class="game-shell">
  <app-game-header />
  @switch (game.view()) {
    @case ('intro') {
      <app-intro />
    }
    @case ('map') {
      <app-world-map />
    }
    @case ('enterprise') {
      <app-enterprise-hub />
    }
    @case ('quest') {
      <app-quest />
    }
    @case ('career') {
      <app-career />
    }
  }
</main>

@if (game.collectionOpen()) {
  <app-skill-collection />
}
@if (game.settingsOpen()) {
  <app-settings />
}
